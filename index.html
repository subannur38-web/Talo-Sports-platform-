<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talo Sports Platform</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

const COLORS = {
  gold: "#C8881A",
  goldLight: "#E8A830",
  navy: "#0D1B3E",
  navyMid: "#1A2F5E",
  dark: "#080F1E",
  white: "#F5F0E8",
  muted: "#8A95A8",
  success: "#2ECC8A",
};

const styles = `
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080F1E;
    color: #F5F0E8;
    font-family: 'DM Sans', sans-serif;
  }

  .talo-app {
    min-height: 100vh;
    background: #080F1E;
    position: relative;
    overflow-x: hidden;
  }

  .noise-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  /* NAV */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,15,30,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(200,136,26,0.2);
    padding: 0 2rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 36px;
    height: 36px;
    background: #C8881A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 14px;
    color: #080F1E;
    letter-spacing: -1px;
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 18px;
    color: #F5F0E8;
    letter-spacing: 2px;
  }

  .logo-sub {
    font-size: 9px;
    color: #C8881A;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: -2px;
  }

  .nav-tabs {
    display: flex;
    gap: 0;
  }

  .nav-tab {
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    background: none;
    border: none;
    color: #8A95A8;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
  }

  .nav-tab:hover { color: #F5F0E8; }

  .nav-tab.active {
    color: #C8881A;
  }

  .nav-tab.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 20px;
    right: 20px;
    height: 2px;
    background: #C8881A;
  }

  .nav-cta {
    background: #C8881A;
    color: #080F1E;
    border: none;
    padding: 8px 20px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
  }

  .nav-cta:hover { background: #E8A830; }

  /* HERO */
  .hero {
    position: relative;
    padding: 80px 2rem 60px;
    overflow: hidden;
  }

  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(200,136,26,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,136,26,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black, transparent);
  }

  .hero-glow {
    position: absolute;
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(200,136,26,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(200,136,26,0.1);
    border: 1px solid rgba(200,136,26,0.3);
    padding: 6px 14px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #C8881A;
    margin-bottom: 28px;
  }

  .hero-badge-dot {
    width: 6px;
    height: 6px;
    background: #C8881A;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: clamp(36px, 6vw, 72px);
    line-height: 1.0;
    color: #F5F0E8;
    margin-bottom: 20px;
  }

  .hero-title span {
    color: #C8881A;
    display: block;
  }

  .hero-subtitle {
    font-size: 16px;
    color: #8A95A8;
    font-weight: 300;
    max-width: 560px;
    margin: 0 auto 40px;
    line-height: 1.7;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 32px 0;
    border-top: 1px solid rgba(200,136,26,0.15);
    border-bottom: 1px solid rgba(200,136,26,0.15);
    margin-bottom: 40px;
  }

  .hero-stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: #C8881A;
  }

  .hero-stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8A95A8;
    margin-top: 4px;
  }

  /* FILTER BAR */
  .filter-bar {
    background: rgba(13,27,62,0.4);
    border: 1px solid rgba(200,136,26,0.12);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filter-bar::-webkit-scrollbar { display: none; }

  .filter-tab {
    padding: 16px 20px;
    background: none;
    border: none;
    color: #8A95A8;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .filter-tab:hover { color: #F5F0E8; }

  .filter-tab.active {
    color: #C8881A;
    border-bottom-color: #C8881A;
  }

  /* MAIN CONTENT */
  .main-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 2rem;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 32px;
  }

  /* SIDEBAR */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .sidebar-card {
    background: rgba(13,27,62,0.3);
    border: 1px solid rgba(200,136,26,0.12);
    padding: 20px;
  }

  .sidebar-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #C8881A;
    margin-bottom: 16px;
  }

  .sidebar-filter-btn {
    width: 100%;
    padding: 10px 14px;
    background: none;
    border: 1px solid rgba(200,136,26,0.12);
    color: #8A95A8;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    margin-bottom: 6px;
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar-filter-btn:hover, .sidebar-filter-btn.active {
    background: rgba(200,136,26,0.1);
    border-color: rgba(200,136,26,0.4);
    color: #F5F0E8;
  }

  .filter-count {
    background: rgba(200,136,26,0.2);
    color: #C8881A;
    font-size: 10px;
    padding: 2px 6px;
  }

  .sidebar-metric {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(200,136,26,0.08);
  }

  .sidebar-metric:last-child { border-bottom: none; }

  .metric-label { font-size: 12px; color: #8A95A8; }
  .metric-value { font-size: 13px; color: #C8881A; font-weight: 600; }

  /* CARDS GRID */
  .cards-section {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    color: #F5F0E8;
  }

  .section-count {
    font-size: 12px;
    color: #8A95A8;
    letter-spacing: 1px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  /* MARKETPLACE CARD */
  .market-card {
    background: rgba(13,27,62,0.25);
    border: 1px solid rgba(200,136,26,0.1);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .market-card:hover {
    border-color: rgba(200,136,26,0.4);
    transform: translateY(-3px);
    background: rgba(13,27,62,0.5);
  }

  .market-card:hover .card-hover-bar {
    width: 100%;
  }

  .card-hover-bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: linear-gradient(90deg, #C8881A, #E8A830);
    transition: width 0.4s ease;
  }

  .card-header {
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .card-type-badge {
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 4px 8px;
    background: rgba(200,136,26,0.1);
    color: #C8881A;
    border: 1px solid rgba(200,136,26,0.2);
  }

  .card-verified {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    color: #2ECC8A;
  }

  .card-body {
    padding: 0 20px 20px;
  }

  .card-org {
    font-size: 11px;
    color: #C8881A;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: #F5F0E8;
    line-height: 1.2;
    margin-bottom: 10px;
  }

  .card-desc {
    font-size: 12px;
    color: #8A95A8;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .card-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    padding: 14px 0;
    border-top: 1px solid rgba(200,136,26,0.08);
    border-bottom: 1px solid rgba(200,136,26,0.08);
    margin-bottom: 16px;
  }

  .card-metric-val {
    font-size: 15px;
    font-weight: 600;
    color: #F5F0E8;
  }

  .card-metric-lbl {
    font-size: 9px;
    color: #8A95A8;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .card-value {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    color: #C8881A;
  }

  .card-value-lbl {
    font-size: 10px;
    color: #8A95A8;
    margin-top: 1px;
  }

  .card-action-btn {
    background: rgba(200,136,26,0.1);
    border: 1px solid rgba(200,136,26,0.3);
    color: #C8881A;
    padding: 8px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }

  .card-action-btn:hover {
    background: #C8881A;
    color: #080F1E;
  }

  /* FEATURED CARD */
  .featured-card {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, rgba(200,136,26,0.08) 0%, rgba(13,27,62,0.4) 60%);
    border: 1px solid rgba(200,136,26,0.25);
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    position: relative;
  }

  .featured-tag {
    position: absolute;
    top: 0;
    right: 0;
    background: #C8881A;
    color: #080F1E;
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 12px;
    font-weight: 600;
  }

  .featured-left {
    padding: 32px;
  }

  .featured-right {
    padding: 32px;
    border-left: 1px solid rgba(200,136,26,0.1);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* ATHLETE CARD */
  .athlete-card {
    background: rgba(13,27,62,0.25);
    border: 1px solid rgba(200,136,26,0.1);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .athlete-card:hover {
    border-color: rgba(200,136,26,0.4);
    transform: translateY(-3px);
  }

  .athlete-header {
    background: linear-gradient(135deg, rgba(200,136,26,0.15), rgba(13,27,62,0.5));
    padding: 24px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .athlete-avatar {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #C8881A, #E8A830);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: #080F1E;
    flex-shrink: 0;
  }

  .athlete-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: #F5F0E8;
  }

  .athlete-sport {
    font-size: 11px;
    color: #C8881A;
    letter-spacing: 1px;
    margin-top: 3px;
  }

  .athlete-body {
    padding: 16px 20px 20px;
  }

  .athlete-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .athlete-stat {
    background: rgba(200,136,26,0.05);
    border: 1px solid rgba(200,136,26,0.08);
    padding: 10px;
  }

  .athlete-stat-val {
    font-size: 16px;
    font-weight: 600;
    color: #F5F0E8;
  }

  .athlete-stat-lbl {
    font-size: 9px;
    color: #8A95A8;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tag {
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid rgba(200,136,26,0.2);
    color: #C8881A;
  }

  /* SUMMIT BANNER */
  .summit-banner {
    background: linear-gradient(135deg, #0D1B3E 0%, #1A2F5E 50%, #0D1B3E 100%);
    border: 1px solid rgba(200,136,26,0.3);
    padding: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }

  .summit-banner::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 200px;
    height: 200px;
    background: radial-gradient(circle, rgba(200,136,26,0.15), transparent 70%);
  }

  .summit-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #C8881A;
    margin-bottom: 8px;
  }

  .summit-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: #F5F0E8;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .summit-date {
    font-size: 13px;
    color: #8A95A8;
  }

  .summit-cta {
    background: #C8881A;
    color: #080F1E;
    border: none;
    padding: 14px 28px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .summit-cta:hover { background: #E8A830; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,15,30,0.9);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal {
    background: #0D1B3E;
    border: 1px solid rgba(200,136,26,0.3);
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-header {
    background: linear-gradient(135deg, rgba(200,136,26,0.15), transparent);
    padding: 28px;
    border-bottom: 1px solid rgba(200,136,26,0.15);
  }

  .modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: 1px solid rgba(200,136,26,0.3);
    color: #8A95A8;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .modal-close:hover { color: #F5F0E8; border-color: #C8881A; }

  .modal-body {
    padding: 28px;
  }

  .modal-section {
    margin-bottom: 24px;
  }

  .modal-section-title {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #C8881A;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(200,136,26,0.1);
  }

  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .modal-field {
    background: rgba(200,136,26,0.05);
    border: 1px solid rgba(200,136,26,0.08);
    padding: 12px;
  }

  .modal-field-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #8A95A8;
    margin-bottom: 4px;
  }

  .modal-field-value {
    font-size: 14px;
    color: #F5F0E8;
    font-weight: 500;
  }

  .modal-action {
    background: #C8881A;
    color: #080F1E;
    border: none;
    width: 100%;
    padding: 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }

  .modal-action:hover { background: #E8A830; }

  .modal-secondary {
    background: transparent;
    color: #C8881A;
    border: 1px solid rgba(200,136,26,0.3);
    width: 100%;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .modal-secondary:hover {
    background: rgba(200,136,26,0.1);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #080F1E; }
  ::-webkit-scrollbar-thumb { background: rgba(200,136,26,0.3); }
`;

const SPONSORSHIPS = [
  {
    id: 1,
    type: "League Sponsorship",
    featured: true,
    org: "Football Kenya Federation",
    title: "FKF Premier League — Title Naming Rights 2026/27",
    desc: "Exclusive naming rights for Kenya's top-flight football league. 18 clubs, 306 matches, national broadcast coverage across 4 channels and streaming platforms.",
    metrics: [{ val: "2.4M", lbl: "Fan Reach" }, { val: "18", lbl: "Clubs" }, { val: "4", lbl: "Broadcasters" }],
    value: "USD 850,000",
